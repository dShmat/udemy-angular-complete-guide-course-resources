<app-header/>

<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user
          [user]="user"
          (selectedUser)="onSelectUser($event)"
        />
      </li>
    }
  </ul>
  @if (selectedName) {
    <app-tasks [selectedName]="selectedName"/>
  } @else {
    <p id="fallback">Select a user to see their task</p>
  }
</main>
